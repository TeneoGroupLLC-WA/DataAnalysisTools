# Quality gates for the tools under tools/. The tools themselves are standard library only;
# these settings configure the dev tools CI runs (see requirements-dev.txt and .github/workflows/ci.yml).

[tool.coverage.run]
branch = true
source = ["tools"]
omit = ["*/tests/*", "*/mutants/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["tools/**/*.py"]
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.bandit]
exclude_dirs = ["tests", "mutants"]

[tool.pytest.ini_options]
testpaths = ["tools"]
norecursedirs = ["mutants", ".*"]
